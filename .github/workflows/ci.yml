name: KalyanSetu CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-verify:
    name: Build & Verify
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck / lint
        run: npm run lint

      - name: Run production build
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -d dist || { echo "dist directory not found"; exit 1; }
          test -f dist/index.html || { echo "dist/index.html not found"; exit 1; }
          echo "✓ Production build verified successfully!"
